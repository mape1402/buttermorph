name: Tag & Release

on:
  workflow_dispatch:

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get tag from CHANGELOG.md
        id: changelog
        run: |
          TAG_LINE=$(grep -m1 -E '^## \[v[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md)
          TAG=$(echo "$TAG_LINE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')

          if [ -z "$TAG" ]; then
            echo "No release tag found in CHANGELOG.md."
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          awk -v tag_line="$TAG_LINE" '
            $0 == tag_line { in_section=1; next }
            in_section && /^## / { exit }
            in_section
          ' CHANGELOG.md > release_notes.txt

      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.changelog.outputs.tag }}
          git push origin ${{ steps.changelog.outputs.tag }}

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body_path: release_notes.txt
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
