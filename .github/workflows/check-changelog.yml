name: Check CHANGELOG

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect source changes
        id: check_diff
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          FILES=$(git diff --name-only $BASE_REF...HEAD)
          echo "$FILES"

          if echo "$FILES" | grep -qE '^(src|samples|tests)/|^Directory\.Build\.props$|^Directory\.Packages\.props$|^[^/]+\.sln$'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Require CHANGELOG.md update
        if: steps.check_diff.outputs.code_changed == 'true'
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          if git diff --name-only $BASE_REF...HEAD | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG.md was updated."
          else
            echo "CHANGELOG.md was not updated. Please document user-facing changes."
            exit 1
          fi
